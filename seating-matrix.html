*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F0EDE6;
  --card:#F8F6F3;
  --ink:#1A1612;
  --teak:#8B5A3C;
  --forest:#3D5A3A;
  --forest-pale:#F3F7F1;
  --rule:#DDD9D0;
  --muted:#8A867F;
  --faint:#E7E3DB;
  --white:#FDFCFA;
}
html,body{
  background:var(--cream);
  color:var(--ink);
  font-family:'PG',system-ui,sans-serif;
  font-weight:400;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  height:100%;
  overflow:hidden;
}

/* ── TOP BAR ── */
.topbar{
  height:50px;
  background:var(--ink);
  display:flex;
  align-items:center;
  padding:0 36px;
  justify-content:space-between;
  flex-shrink:0;
  position:relative;
  z-index:10;
}
.logo{font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#fff}
.guide-tag{font-size:10px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.35)}

/* ── APP SHELL ── */
.shell{display:flex;height:calc(100vh - 50px);overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--rule);
  background:var(--cream);
  overflow:hidden;
}
.sb-search-wrap{
  padding:16px 20px 12px;
  border-bottom:1px solid var(--rule);
  display:flex;
  flex-direction:column;
  gap:10px;
  flex-shrink:0;
}
.sb-search{
  font-family:'PG',system-ui,sans-serif;
  font-size:12px;
  font-weight:400;
  background:var(--white);
  border:1px solid var(--rule);
  padding:8px 12px;
  color:var(--ink);
  outline:none;
  width:100%;
  transition:border-color .12s;
}
.sb-search:focus{border-color:var(--ink)}
.sb-search::placeholder{color:var(--muted)}
.env-toggle{display:flex;gap:0}
.env-btn{
  flex:1;
  font-family:'PG',system-ui,sans-serif;
  font-size:10px;
  font-weight:400;
  letter-spacing:.08em;
  text-transform:uppercase;
  border:1px solid var(--rule);
  background:transparent;
  color:var(--muted);
  padding:6px 0;
  cursor:pointer;
  transition:all .12s;
  margin-left:-1px;
}
.env-btn:first-child{margin-left:0}
.env-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);z-index:1}

.sb-list{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.sb-section-lbl{
  padding:14px 20px 5px;
  font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);
  position:sticky;top:0;
  background:var(--cream);
  z-index:5;
}
.sb-row{
  display:flex;align-items:center;
  padding:10px 20px;
  cursor:pointer;
  gap:10px;
  border-radius:0;
  transition:background .1s;
  border-bottom:1px solid rgba(0,0,0,0);
}
.sb-row:hover{background:rgba(0,0,0,.04)}
.sb-row.sel{background:var(--ink)}
.sb-row.sel .sb-coll,.sb-row.sel .sb-fn,.sb-row.sel .sb-ht{color:#fff}
.sb-row.sel .sb-ht{color:rgba(255,255,255,.45)}
.sb-row.gone{display:none}
.sb-txt{flex:1;min-width:0}
.sb-coll{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.sb-fn{font-weight:300;color:var(--muted)}
.sb-ht{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.sb-indicator{
  flex-shrink:0;
  width:3px;
  border-radius:2px;
  background:var(--rule);
  align-self:stretch;
  min-height:20px;
  position:relative;
  overflow:hidden;
}
.sb-indicator-fill{
  position:absolute;
  bottom:0;left:0;right:0;
  border-radius:2px;
  background:var(--ink);
  transition:height .2s;
}
.sb-row.sel .sb-indicator{background:rgba(255,255,255,.2)}
.sb-row.sel .sb-indicator-fill{background:rgba(255,255,255,.5)}
.sb-row.bar-h .sb-indicator-fill{background:var(--teak)}

/* ── DETAIL ── */
.detail{
  flex:1;
  overflow-y:auto;
  background:var(--white);
  display:flex;
  flex-direction:column;
}
.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:60px;
}
.empty-glyph{
  font-size:11px;
  font-weight:500;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--rule);
}
.empty-sub{font-size:12px;font-weight:300;color:var(--muted)}

/* TABLE HERO */
.table-hero{
  padding:40px 48px 32px;
  border-bottom:1px solid var(--rule);
  flex-shrink:0;
}
.hero-env{
  font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
  display:flex;align-items:center;gap:10px;
}
.hero-env-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--ink);display:inline-block;
}
.hero-title{
  font-size:42px;font-weight:300;letter-spacing:-.025em;line-height:1;
  margin-bottom:20px;
}
.hero-title b{font-weight:500}
.hero-sizes{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
}
.size-tag{
  font-size:11px;font-weight:400;
  padding:4px 10px;
  border:1px solid var(--rule);
  color:var(--ink);
  background:var(--cream);
  letter-spacing:.01em;
}
.hero-h{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:400;color:var(--muted);
  margin-top:2px;
}
.hero-h-val{
  font-size:13px;font-weight:500;color:var(--ink);
  background:var(--ink);color:#fff;
  padding:2px 8px;font-size:10px;letter-spacing:.06em;
}
.hero-h-val.bar{background:var(--teak)}

/* SEATING CONTENT */
.seating-content{padding:36px 48px 60px;flex:1}
.section{margin-bottom:44px}
.section-label{
  font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);
  display:flex;align-items:center;gap:14px;
  margin-bottom:20px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--rule)}
.section-count{font-weight:300;letter-spacing:0;text-transform:none;font-size:10px;color:var(--rule)}

/* CARDS */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  transition:background .15s;
  cursor:default;
}
.card:hover{background:#F0EDE6}
.card.rec{background:var(--forest-pale)}
.card.rec:hover{background:#E4EDE1}
.rec-mark{
  position:absolute;top:14px;right:14px;
  font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--forest);
}
.card-coll{
  font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;
}
.card-name{
  font-size:15px;font-weight:500;line-height:1.2;margin-bottom:16px;
}
.card-name span{font-weight:300;color:var(--muted)}

/* HEIGHT DIAGRAM */
.hdiag{
  display:flex;
  align-items:flex-end;
  gap:5px;
  margin-bottom:14px;
  height:72px;
}
.hd-bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.hd-bar{
  width:16px;
  border-radius:1px;
  flex-shrink:0;
}
.hd-bar.t{background:var(--ink)}
.hd-bar.s{background:var(--teak)}
.hd-num{font-size:9px;font-weight:500;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.hd-gap-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
}
.hd-gap-bar{
  width:16px;
  background:transparent;
  border-left:1px dashed var(--rule);
  border-right:1px dashed var(--rule);
  flex-shrink:0;
}
.hd-gap-num{font-size:9px;font-weight:500;color:var(--teak);white-space:nowrap}

.card-dims{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.dim-pair{display:flex;flex-direction:column;gap:1px}
.dim-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dim-val{font-size:12px;font-weight:500;color:var(--ink)}
.card-mats{
  font-size:10px;color:var(--muted);font-style:italic;
  line-height:1.5;margin-top:auto;padding-top:10px;
  border-top:1px solid rgba(0,0,0,.06);
}
.card-note{font-size:10px;color:var(--teak);line-height:1.4;margin-top:6px}
.card-sizes{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.card-sizes span{font-size:10px;color:var(--muted);border:1px solid var(--rule);padding:1px 5px}

@media(max-width:840px){
  .shell{flex-direction:column;overflow:auto;height:auto}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .sb-list{max-height:200px}
  .detail{overflow:visible}
  .table-hero{padding:28px 24px 24px}
  .hero-title{font-size:32px}
  .seating-content{padding:24px}
}
@media print{
  .topbar,.sidebar{display:none}
  .shell{height:auto;overflow:visible}
  .detail{overflow:visible}
  .section{page-break-inside:avoid}
}
</style>

<body>

<script>
const T={"PI dining table": {"collection": "PI", "height_cm": 76, "indoor": true, "variants": [{"label": "140\u00d780 cm"}, {"label": "160\u00d780 cm"}, {"label": "180\u00d790 cm"}, {"label": "200\u00d795 cm"}, {"label": "220\u00d795 cm"}, {"label": "240\u00d7100 cm"}], "materials": ["oak", "teak brown", "teak dark brown"]}, "Mikado dining table": {"collection": "Mikado", "height_cm": 76, "indoor": true, "variants": [{"label": "203\u00d7106 cm (rect)"}, {"label": "240\u00d7110 cm (rect)"}, {"label": "280\u00d7110 cm (rect)"}, {"label": "267\u00d7138 cm (oval)"}, {"label": "150\u00d7150 cm (round)"}], "materials": ["oak"]}, "Sequence dining table": {"collection": "Sequence", "height_cm": 76, "indoor": true, "variants": [{"label": "240\u00d7110 cm"}], "materials": ["mahogany dark brown"]}, "Flow dining table": {"collection": "Flow", "height_cm": 76, "indoor": true, "variants": [{"label": "200\u00d7110 cm"}, {"label": "220\u00d7110 cm"}, {"label": "250\u00d7113 cm"}], "materials": ["mahogany rose brown"]}, "X dining table": {"collection": "X", "height_cm": 76, "indoor": true, "variants": [{"label": "200\u00d7100 cm"}, {"label": "224\u00d7100 cm"}, {"label": "250\u00d7100 cm"}], "materials": ["oak"]}, "Roller Max dining table": {"collection": "Roller Max", "height_cm": 76, "indoor": true, "variants": [{"label": "150\u00d7150 cm (square)"}], "materials": ["oak", "mahogany dark brown"]}, "Elements dining table": {"collection": "Elements", "height_cm": 76, "indoor": true, "variants": [{"label": "90\u00d790 cm (square)"}, {"label": "125\u00d7125 cm (square)"}, {"label": "150\u00d7150 cm (square)"}, {"label": "200\u00d7143 cm (pebble shape)"}, {"label": "240\u00d7100 cm (oblong)"}], "materials": ["microcement off white"]}, "Torsion dining table": {"collection": "Torsion", "height_cm": 76, "indoor": true, "variants": [{"label": "70\u00d770 cm (round)"}, {"label": "90\u00d790 cm (round)"}, {"label": "127\u00d7127 cm (round)"}, {"label": "70\u00d770 cm (square)"}], "materials": const S={"Bok dining chair": {"collection": "Bok", "type": "Dining Chair", "indoor": true, "seat_height_cm": 46, "width_cm": 50, "depth_cm": 54, "height_cm": 76, "materials": ["oak", "teak", "varnished oak (various)", "varnished teak"], "note": "Available with/without cushion (fabric or leather). Oak/teak variants.", "sizes_cm": []}, "PI dining chair": {"collection": "PI", "type": "Dining Chair", "indoor": true, "seat_height_cm": 47, "width_cm": 48, "depth_cm": 53, "height_cm": 79, "materials": ["oak", "teak dark brown"], "note": "With armrest: 55cm wide. Without armrest: 48cm wide.", "sizes_cm": []}, "Casale dining chair": {"collection": "Casale", "type": "Dining Chair", "indoor": true, "seat_height_cm": 46, "width_cm": 46, "depth_cm": 52, "height_cm": 80, "materials": ["oak", "oak black"], "note": "", "sizes_cm": []}, "Eye dining chair": {"collection": "Eye", "type": "Dining Chair", "indoor": true, "seat_height_cm": 46, "width_cm": 50, "depth_cm": 56, "height_cm": 78, "materials": ["oak + warm grey fabric"], "note": "", "sizes_cm": []}, "Risu dining chair": {"collection": "Risu", "type": "Dining Chair", "indoor": true, "seat_height_cm": null, "width_cm": 48, "depth_cm": 48, "height_cm": 77, "materials": ["oak"], "note": "", "sizes_cm": []}, "Unda dining chair": {"collection": "Unda", "type": "Dining Chair", "indoor": true, "seat_height_cm": null, "width_cm": 61, "depth_cm": 58, "height_cm": 81, "materials": ["oak salt fabric", "oak black charcoal fabric"], "note": "", "sizes_cm": []}, "Bok outdoor dining chair": {"collection": "Bok", "type": "Dining Chair", "indoor": false, "seat_height_cm": 47, "width_cm": 52, "depth_cm": 60, "height_cm": 83, "materials": ["teak"], "note": "", "sizes_cm": []}, "Jack outdoor dining chair": {"collection": "Jack", "type": "Dining Chair", "indoor": false, "seat_height_cm": 47, "width_cm": 60, "depth_cm": 63, "height_cm": 88, "materials": ["teak"], "note": "", "sizes_cm": []}, "Capitan outdoor dining chair": {"collection": "Capitan", "type": "Dining Chair", "indoor": false, "seat_height_cm": 47, "width_cm": 58, "depth_cm": 62, "height_cm": 84, "materials": ["teak"], "note": "", "sizes_cm": []}, "Elin outdoor dining chair": {"collection": "Elin", "type": "Dining Chair", "indoor": false, "seat_height_cm": 47, "width_cm": 57, "depth_cm": 60, "height_cm": 78, "materials": ["teak"], "note": "", "sizes_cm": []}, "Osso stool": {"collection": "Osso", "type": "Stool", "indoor": true, "seat_height_cm": 49, "width_cm": 50, "depth_cm": 33, "height_cm": 49, "materials": ["oak", "teak brown", "oak black"], "note": "+2cm with leather cushion. Low stool, not for dining tables.", "sizes_cm": []}, "Roller Max stool": {"collection": "Roller Max", "type": "Stool", "indoor": true, "seat_height_cm": 48, "width_cm": 48, "depth_cm": 35, "height_cm": 49, "materials": ["mahogany dark brown"], "note": "", "sizes_cm": []}, "Osso counter stool": {"collection": "Osso", "type": "Counter Stool", "indoor": true, "seat_height_cm": 67, "width_cm": 57, "depth_cm": 33, "height_cm": 67, "materials": ["oak", "teak brown", "oak black"], "note": "+2cm with leather cushion. Ideal for counter height ~90-95cm.", "sizes_cm": []}, "N3 counter stool": {"collection": "N", "type": "Counter Stool", "indoor": true, "seat_height_cm": 65, "width_cm": 49, "depth_cm": 50, "height_cm": 92, "materials": ["oak"], "note": "", "sizes_cm": []}, "Bok counter stool": {"collection": "Bok", "type": "Counter Stool", "indoor": true, "seat_height_cm": 65, "width_cm": 50, "depth_cm": 50, "height_cm": 93, "materials": ["oak", "oak black", "varnished oak cognac leather"], "note": "", "sizes_cm": []}, "Osso bar stool": {"collection": "Osso", "type": "Bar Stool", "indoor": true, "seat_height_cm": 78, "width_cm": 57, "depth_cm": 33, "height_cm": 80, "materials": ["oak", "teak brown", "oak black"], "note": "Ideal for bar height ~105-110cm.", "sizes_cm": []}, "Bok bar stool": {"collection": "Bok", "type": "Bar Stool", "indoor": true, "seat_height_cm": 77, "width_cm": 50, "depth_cm": 53, "height_cm": 103, "materials": ["oak", "varnished oak cognac leather"], "note": "Ideal for bar height ~105-110cm.", "sizes_cm": []}, "N4 bar stool": {"collection": "N", "type": "Bar Stool", "indoor": true, "seat_height_cm": 81, "width_cm": 48, "depth_cm": 50, "height_cm": 110, "materials": ["oak"], "note": "Ideal for bar height ~105-112cm.", "sizes_cm": []}, "Jack outdoor bar stool": {"collection": "Jack", "type": "Bar Stool", "indoor": false, "seat_height_cm": 78, "width_cm": 46, "depth_cm": 50, "height_cm": 96, "materials": ["teak", "teak + cushion"], "note": "", "sizes_cm": []}, "Bok bench": {"collection": "Bok", "type": "Bench", "indoor": true, "seat_height_cm": 46, "width_cm": null, "depth_cm": 35, "height_cm": 46, "materials": ["oak", "teak", "teak brown", "oak brown", "oak black"], "note": "Available in 4 lengths (126/146/166/186 cm).", "sizes_cm": [126, 146, 166, 186]}, "PI bench": {"collection": "PI", "type": "Bench", "indoor": true, "seat_height_cm": 46, "width_cm": null, "depth_cm": 35, "height_cm": 46, "materials": ["oak", "teak brown"], "note": "Available in 4 lengths (126/146/166/186 cm).", "sizes_cm": [126, 146, 166, 186]}, "Spindle bench": {"collection": "Spindle", "type": "Bench", "indoor": true, "seat_height_cm": 46, "width_cm": 150, "depth_cm": 35, "height_cm": 60, "materials": ["oak", "reclaimed teak", "oak black"], "note": "Has a back (60cm total). Seat height 46cm.", "sizes_cm": []}, "Jack bench": {"collection": "Jack", "type": "Bench", "indoor": true, "seat_height_cm": 44, "width_cm": 150, "depth_cm": 41, "height_cm": 59, "materials": ["mahogany dark brown"], "note": "Has a back. Seat height ~44cm. Available with fabric or leather cushion.", "sizes_cm": []}, "Stability bench": {"collection": "Stability", "type": "Bench", "indoor": true, "seat_height_cm": 46, "width_cm": 166, "depth_cm": 35, "height_cm": 46, "materials": ["fabric upholstered"], "note": "", "sizes_cm": []}, "Bok outdoor bench": {"collection": "Bok", "type": "Bench", "indoor": false, "seat_height_cm": 46, "width_cm": null, "depth_cm": 35, "height_cm": 46, "materials": ["teak"], "note": "162cm length. For outdoor dining.", "sizes_cm": [162]}};
const SC=0.52; // px-per-cm for height diagram
let ENV="all", SEL=null;

function compat(th,sh){
  if(!sh)return"unk";
  const g=th-sh;
  if(g>=25&&g<=34)return"ok";
  if((g>=20&&g<25)||(g>34&&g<=38))return"border";
  return"no";
}

/* ── SIDEBAR ── */
function buildSb(){
  const el=document.getElementById("sbList");
  el.innerHTML="";
  const grp={Indoor:[],Outdoor:[]};
  for(const[n,t]of Object.entries(T)) grp[t.indoor?"Indoor":"Outdoor"].push([n,t]);
  for(const[g,rows]of Object.entries(grp)){
    const lbl=document.createElement("div");
    lbl.className="sb-section-lbl";lbl.textContent=g;el.appendChild(lbl);
    for(const[n,t]of rows){
      const isBar=t.height_cm>79;
      const fillH=Math.min(100,Math.round((t.height_cm/120)*100));
      const fn=n.replace(t.collection+" ","");
      const row=document.createElement("div");
      row.className="sb-row"+(isBar?" bar-h":"");
      row.dataset.n=n;
      row.dataset.env=t.indoor?"indoor":"outdoor";
      row.innerHTML=`
        <div class="sb-txt">
          <div class="sb-coll"><b>${t.collection}</b><span class="sb-fn"> ${fn}</span></div>
          <div class="sb-ht">${t.height_cm} cm &middot; ${t.variants.length} size${t.variants.length>1?"s":""}</div>
        </div>
        <div class="sb-indicator"><div class="sb-indicator-fill" style="height:${fillH}%"></div></div>`;
      row.onclick=()=>pick(n);
      el.appendChild(row);
    }
  }
  applyFilters();
}

function applyFilters(){
  const q=document.querySelector(".sb-search").value.toLowerCase();
  document.querySelectorAll(".sb-row").forEach(r=>{
    const envOk=ENV==="all"||r.dataset.env===ENV;
    const qOk=!q||r.dataset.n.toLowerCase().includes(q);
    r.classList.toggle("gone",!envOk||!qOk);
  });
}

function setEnv(btn,v){
  ENV=v;
  document.querySelectorAll(".env-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  applyFilters();
  if(SEL) render(SEL);
}

function doSearch(v){applyFilters()}

/* ── DETAIL ── */
function pick(n){
  SEL=n;
  document.querySelectorAll(".sb-row").forEach(r=>r.classList.toggle("sel",r.dataset.n===n));
  render(n);
}

function render(n){
  const t=T[n];
  const isBar=t.height_cm>79;
  const fn=n.replace(t.collection+" ","");
  const tEnv=t.indoor?"indoor":"outdoor";

  // Build seating groups — match environment automatically
  const rec=[],ok=[],border=[];
  for(const[sn,s]of Object.entries(S)){
    if((s.indoor?"indoor":"outdoor")!==tEnv) continue; // env must match
    const c=compat(t.height_cm,s.seat_height_cm);
    if(c==="no"||c==="unk") continue;
    const isRec=s.collection===t.collection&&c==="ok";
    if(isRec) rec.push([sn,s,c]);
    else if(c==="ok") ok.push([sn,s,c]);
    else border.push([sn,s,c]);
  }

  let html=`
  <div class="table-hero">
    <div class="hero-env">
      <span class="hero-env-dot"></span>
      ${t.collection} Collection &nbsp;&middot;&nbsp; ${t.indoor?"Indoor furniture":"Outdoor furniture"}
    </div>
    <div class="hero-title"><b>${t.collection}</b> ${fn}</div>
    <div class="hero-sizes">
      ${t.variants.map(v=>`<div class="size-tag">${v.label}</div>`).join("")}
    </div>
    <div class="hero-h">
      Table height
      <span class="hero-h-val${isBar?" bar":""}">${t.height_cm} cm</span>
    </div>
  </div>
  <div class="seating-content">`;

  if(rec.length) html+=buildSection("Same collection — recommended",rec,t.height_cm);
  if(ok.length)  html+=buildSection("Also compatible",ok,t.height_cm);
  if(border.length) html+=buildSection("Borderline fit",border,t.height_cm);
  if(!rec.length&&!ok.length&&!border.length)
    html+=`<p style="color:var(--muted);font-weight:300;margin-top:8px">No compatible ${tEnv} seating in the catalogue.</p>`;

  html+=`</div>`;
  document.getElementById("detail").innerHTML=html;
}

function buildSection(title,items,th){
  const cards=items.map(([sn,s,c])=>{
    const isRec=c==="ok"&&s.collection===T[SEL].collection;
    const fn=sn.replace(s.collection+" ","");
    const g=s.seat_height_cm?th-s.seat_height_cm:null;

    // height diagram — all to same 72px container height
    const maxH=120; // cm represented by full 72px
    const px=cm=>Math.round((cm/maxH)*72);
    const tPx=px(th);
    const sPx=s.seat_height_cm?px(s.seat_height_cm):null;
    const gPx=sPx?tPx-sPx:null;

    const diag=sPx?`
      <div class="hdiag">
        <div class="hd-bar-wrap">
          <div class="hd-bar t" style="height:${tPx}px"></div>
          <div class="hd-num">${th}</div>
        </div>
        <div class="hd-gap-wrap">
          <div class="hd-gap-bar" style="height:${gPx}px;margin-bottom:${sPx}px"></div>
          <div class="hd-gap-num">${g} cm</div>
        </div>
        <div class="hd-bar-wrap">
          <div class="hd-bar s" style="height:${sPx}px"></div>
          <div class="hd-num">${s.seat_height_cm}</div>
        </div>
      </div>`:``;

    return `<div class="card${isRec?" rec":""}">
      ${isRec?'<div class="rec-mark">✦ Recommended</div>':""}
      <div class="card-coll">${s.collection}</div>
      <div class="card-name"><b>${s.collection}</b> <span>${fn}</span></div>
      ${diag}
      <div class="card-dims">
        ${s.seat_height_cm?`<div class="dim-pair"><div class="dim-lbl">Seat H</div><div class="dim-val">${s.seat_height_cm} cm</div></div>`:""}
        ${s.width_cm?`<div class="dim-pair"><div class="dim-lbl">Width</div><div class="dim-val">${s.width_cm} cm</div></div>`:""}
        ${s.depth_cm?`<div class="dim-pair"><div class="dim-lbl">Depth</div><div class="dim-val">${s.depth_cm} cm</div></div>`:""}
      </div>
      ${s.sizes_cm&&s.sizes_cm.length?`<div class="card-sizes">${s.sizes_cm.map(l=>`<span>${l} cm</span>`).join("")}</div>`:""}
      ${s.materials.length?`<div class="card-mats">${s.materials.slice(0,3).join(" · ")}</div>`:""}
      ${s.note?`<div class="card-note">${s.note}</div>`:""}
    </div>`;
  }).join("");

  return `<div class="section">
    <div class="section-label">${title} <span class="section-count">${items.length}</span></div>
    <div class="card-grid">${cards}</div>
  </div>`;
}

buildSb();
</script>
